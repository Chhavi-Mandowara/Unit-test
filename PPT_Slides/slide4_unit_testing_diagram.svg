<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 380" role="img" aria-labelledby="t4 d4">
  <title id="t4">Unit testing flow</title>
  <desc id="d4">Input flows into a unit under test; an automated test compares expected and actual results and reports pass or fail.</desc>
  <defs>
    <filter id="s4glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="s4box" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(138,43,226,0.35)"/>
      <stop offset="100%" stop-color="rgba(138,43,226,0.08)"/>
    </linearGradient>
    <linearGradient id="s4arr" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b967db"/>
      <stop offset="100%" stop-color="#8a2be2"/>
    </linearGradient>
  </defs>

  <rect x="100" y="12" width="120" height="44" rx="10" fill="url(#s4box)" stroke="#8a2be2" stroke-width="2"/>
  <text x="160" y="32" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="600">Input</text>
  <text x="160" y="48" text-anchor="middle" fill="#cccccc" font-family="system-ui,Segoe UI,sans-serif" font-size="11">data / context</text>

  <path d="M160 58 L160 78 M152 70 L160 78 L168 70" stroke="url(#s4arr)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="55" y="82" width="210" height="72" rx="12" fill="url(#s4box)" stroke="#8a2be2" stroke-width="2" filter="url(#s4glow)"/>
  <text x="160" y="108" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="15" font-weight="700">Unit under test</text>
  <text x="160" y="128" text-anchor="middle" fill="#b967db" font-family="system-ui,Segoe UI,sans-serif" font-size="12">smallest testable part</text>
  <text x="160" y="145" text-anchor="middle" fill="#aaaaaa" font-family="system-ui,Segoe UI,sans-serif" font-size="11">function / module / class</text>

  <path d="M160 156 L160 176 M152 168 L160 176 L168 168" stroke="url(#s4arr)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="100" y="180" width="120" height="40" rx="8" fill="rgba(138,43,226,0.15)" stroke="#8a2be2" stroke-width="1.5"/>
  <text x="160" y="205" text-anchor="middle" fill="#ffffff" font-family="system-ui,Segoe UI,sans-serif" font-size="12" font-weight="600">Actual output</text>

  <path d="M160 222 L160 238 M152 230 L160 238 L168 230" stroke="url(#s4arr)" stroke-width="2" fill="none" stroke-linecap="round"/>

  <rect x="30" y="242" width="260" height="118" rx="14" fill="rgba(20,20,20,0.85)" stroke="#8a2be2" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="160" y="268" text-anchor="middle" fill="#8a2be2" font-family="system-ui,Segoe UI,sans-serif" font-size="13" font-weight="700">Automated test</text>

  <rect x="48" y="278" width="100" height="36" rx="8" fill="rgba(76,175,80,0.12)" stroke="#4CAF50" stroke-width="1.5"/>
  <text x="98" y="300" text-anchor="middle" fill="#81c784" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">Expected</text>

  <text x="160" y="298" text-anchor="middle" fill="#888888" font-family="system-ui,Segoe UI,sans-serif" font-size="12">&lt; compare &gt;</text>

  <rect x="172" y="278" width="100" height="36" rx="8" fill="rgba(138,43,226,0.15)" stroke="#b967db" stroke-width="1.5"/>
  <text x="222" y="300" text-anchor="middle" fill="#e1bee7" font-family="system-ui,Segoe UI,sans-serif" font-size="11" font-weight="600">Actual</text>

  <text x="160" y="338" text-anchor="middle" fill="#4CAF50" font-family="system-ui,Segoe UI,sans-serif" font-size="14" font-weight="700" filter="url(#s4glow)">Pass</text>
  <text x="160" y="355" text-anchor="middle" fill="#888888" font-family="system-ui,Segoe UI,sans-serif" font-size="10">or Fail: fix and rerun</text>
</svg>
